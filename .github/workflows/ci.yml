name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  build-hawdb:
    name: Build HawDB v${{ matrix.hawdb-version }} wheel
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        hawdb-version: ["0.26.0", "0.29.0"]
    steps:
      - name: Check out HawDB v${{ matrix.hawdb-version }}
        uses: actions/checkout@v4
        with:
          repository: nowledge-co/hawdb
          ref: v${{ matrix.hawdb-version }}
          path: .ci/hawdb
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.1

      - name: Install maturin
        run: python -m pip install maturin==1.15.0

      - name: Build HawDB Python wheel
        working-directory: .ci/hawdb/bindings/python
        env:
          RUSTUP_TOOLCHAIN: 1.99.1
        run: maturin build --release --out dist

      - name: Upload HawDB Python wheel
        uses: actions/upload-artifact@v4
        with:
          name: hawdb-v${{ matrix.hawdb-version }}-python-wheel
          path: .ci/hawdb/bindings/python/dist/*.whl
          if-no-files-found: error

  build:
    name: Build distributions
    runs-on: ubuntu-latest
    steps:
      - name: Check out sqlalchemy_hawdb
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Check release version
        if: github.event_name == 'release'
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          python - <<'PY'
          import os
          import tomllib
          from pathlib import Path

          version = tomllib.loads(Path("pyproject.toml").read_text())["project"]["version"]
          tag = os.environ["RELEASE_TAG"]
          if tag != f"v{version}":
              raise SystemExit(f"Release tag {tag!r} does not match package version {version!r}")
          PY

      - name: Install build tools
        run: python -m pip install build twine 'ruff>=0.14,<1' trove-classifiers

      - name: Validate PyPI classifiers
        run: |
          python - <<'PY'
          import tomllib
          from pathlib import Path

          from trove_classifiers import classifiers

          project = tomllib.loads(Path("pyproject.toml").read_text())["project"]
          invalid = sorted(set(project.get("classifiers", [])) - classifiers)
          if invalid:
              raise SystemExit(f"Invalid PyPI classifiers: {invalid}")
          PY

      - name: Check Python lint and formatting
        run: |
          python -m ruff check sqlalchemy_hawdb tests
          python -m ruff format --check sqlalchemy_hawdb tests

      - name: Build source distribution and wheel
        run: python -m build

      - name: Check distribution metadata
        run: python -m twine check --strict dist/*

      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: python-distributions
          path: dist/*
          if-no-files-found: error

  test:
    name: HawDB v0.29.0 / Python ${{ matrix.python-version }} / SQLAlchemy ${{ matrix.sqlalchemy-version }} / ${{ matrix.hawdb-artifact }}
    needs: [build, build-hawdb]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
        sqlalchemy-version: ["2.0", "2.1"]
        hawdb-artifact: ["source"]
        include:
          - python-version: "3.11"
            sqlalchemy-version: "2.1"
            hawdb-artifact: "pypi"
    steps:
      - name: Check out sqlalchemy_hawdb
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Download distributions
        uses: actions/download-artifact@v4
        with:
          name: python-distributions
          path: dist

      - name: Download HawDB wheel
        if: matrix.hawdb-artifact == 'source'
        uses: actions/download-artifact@v4
        with:
          name: hawdb-v0.29.0-python-wheel
          path: hawdb-dist

      - name: Download HawDB 0.26 wheel for upgrade fixtures
        uses: actions/download-artifact@v4
        with:
          name: hawdb-v0.26.0-python-wheel
          path: hawdb-previous-dist

      - name: Install the dialect wheel and HawDB
        env:
          HAWDB_ARTIFACT: ${{ matrix.hawdb-artifact }}
        run: |
          wheels=(dist/*.whl)
          hawdb_requirement='hawdb==0.29.0'
          if [[ "$HAWDB_ARTIFACT" == 'source' ]]; then
            hawdb_wheels=(hawdb-dist/*.whl)
            hawdb_requirement="${hawdb_wheels[0]}"
          fi
          python -m pip install --only-binary=hawdb "$hawdb_requirement" "${wheels[0]}[test]" 'SQLAlchemy~=${{ matrix.sqlalchemy-version }}.0'

      - name: Install previous HawDB releases for upgrade fixtures
        run: |
          python -m venv "$RUNNER_TEMP/hawdb-0.25"
          "$RUNNER_TEMP/hawdb-0.25/bin/python" -m pip install --only-binary=hawdb 'hawdb==0.25.0'
          python -m venv "$RUNNER_TEMP/hawdb-0.26"
          previous_hawdb_wheels=(hawdb-previous-dist/*.whl)
          "$RUNNER_TEMP/hawdb-0.26/bin/python" -m pip install --only-binary=hawdb "${previous_hawdb_wheels[0]}"
          python -m venv "$RUNNER_TEMP/hawdb-0.27"
          "$RUNNER_TEMP/hawdb-0.27/bin/python" -m pip install --only-binary=hawdb 'hawdb==0.27.0'
          python -m venv "$RUNNER_TEMP/hawdb-0.28"
          "$RUNNER_TEMP/hawdb-0.28/bin/python" -m pip install --only-binary=hawdb 'hawdb==0.28.0'

      - name: Verify HawDB binding package
        working-directory: ${{ runner.temp }}
        run: |
          python - <<'PY'
          from importlib.metadata import version

          import hawdb
          from sqlalchemy_hawdb import HawDBDialect

          assert version("hawdb") == "0.29.0"
          assert version("SQLAlchemy").startswith("${{ matrix.sqlalchemy-version }}.")
          assert callable(hawdb.open)
          assert callable(HawDBDialect.import_dbapi().connect)
          print(hawdb.__file__)
          PY

      - name: Run tests against the installed wheel
        working-directory: ${{ runner.temp }}
        env:
          HAWDB_PREVIOUS_PYTHON: ${{ runner.temp }}/hawdb-0.25/bin/python
          HAWDB_026_PYTHON: ${{ runner.temp }}/hawdb-0.26/bin/python
          HAWDB_027_PYTHON: ${{ runner.temp }}/hawdb-0.27/bin/python
          HAWDB_028_PYTHON: ${{ runner.temp }}/hawdb-0.28/bin/python
        run: python -m pytest "$GITHUB_WORKSPACE/tests"
